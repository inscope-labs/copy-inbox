name: Build Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify signing secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing required signing secrets (KEYSTORE_BASE64, STORE_PASSWORD, or KEY_PASSWORD)."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Toolchain
        run: |
          java -version
          gradle --version

      - name: Read version properties and calculate version
        id: versioning
        run: |
          PROP_FILE="release-code.txt"
          if [ -f "$PROP_FILE" ]; then
            MAJOR=$(grep '^releaseMajor=' "$PROP_FILE" | cut -d'=' -f2 | tr -d '\r')
            MINOR=$(grep '^releaseMinor=' "$PROP_FILE" | cut -d'=' -f2 | tr -d '\r')
            PATCH=$(grep '^releasePatch=' "$PROP_FILE" | cut -d'=' -f2 | tr -d '\r')
          fi

          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-1}
          PATCH=${PATCH:-0}

          VERSION_CODE=1
          if [ -f "version.properties" ]; then
            VC=$(grep '^versionCode=' "version.properties" | cut -d'=' -f2 | tr -d '\r')
            VERSION_CODE=${VC:-1}
          fi

          echo "Read version: $MAJOR.$MINOR.$PATCH"

          # Increment patch variable in memory for workflow
          NEW_PATCH=$((PATCH + 1))

          FULL_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          echo "Workflow release version: $FULL_VERSION"
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "release_major=$MAJOR" >> $GITHUB_OUTPUT
          echo "release_minor=$MINOR" >> $GITHUB_OUTPUT
          echo "release_patch=$NEW_PATCH" >> $GITHUB_OUTPUT

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > upload-key.jks

      - name: Verify decoded keystore
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if ! keytool -list -keystore upload-key.jks -storepass "$STORE_PASSWORD" -alias upload; then
            echo "::error::Keystore verification failed (incorrect password or alias 'upload' missing)."
            rm -f upload-key.jks
            exit 1
          fi

      - name: Assemble Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease \
            -PversionCode=${{ steps.versioning.outputs.version_code }} \
            -PversionName="${{ steps.versioning.outputs.version_name }}"

      - name: Verify APK exists and signature is valid
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Release APK not found after build."
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found in $ANDROID_SDK_ROOT/build-tools."
            exit 1
          fi
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Persist release-code.txt
        if: success()
        run: |
          MAJOR="${{ steps.versioning.outputs.release_major }}"
          MINOR="${{ steps.versioning.outputs.release_minor }}"
          NEW_PATCH="${{ steps.versioning.outputs.release_patch }}"
          FULL_VERSION="${{ steps.versioning.outputs.version_name }}"

          cat << EOF > release-code.txt
releaseMajor=$MAJOR
releaseMinor=$MINOR
releasePatch=$NEW_PATCH
EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-code.txt
          git commit -m "ci: record release version $FULL_VERSION"
          git pull --rebase origin main
          git push

      - name: Clean up keystore
        if: always()
        run: rm -f upload-key.jks
