name: Build Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Toolchain
        run: |
          java -version
          gradle --version

      - name: Read version properties and calculate version
        id: versioning
        run: |
          PROP_FILE="version.properties"
          if [ ! -f "$PROP_FILE" ]; then
            if [ -f "release-code.txt" ]; then
              PROP_FILE="release-code.txt"
            fi
          fi

          if [ -f "$PROP_FILE" ]; then
            MAJOR=$(grep '^releaseMajor=' "$PROP_FILE" | cut -d'=' -f2 | tr -d '\r')
            MINOR=$(grep '^releaseMinor=' "$PROP_FILE" | cut -d'=' -f2 | tr -d '\r')
            PATCH=$(grep '^releasePatch=' "$PROP_FILE" | cut -d'=' -f2 | tr -d '\r')
          fi

          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-1}
          PATCH=${PATCH:-0}

          echo "Read version: $MAJOR.$MINOR.$PATCH"

          # Increment patch variable in memory for workflow
          NEW_PATCH=$((PATCH + 1))

          FULL_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          echo "Workflow release version: $FULL_VERSION"
          echo "version_name=$FULL_VERSION" >> $GITHUB_OUTPUT

      - name: Ensure release keystore exists
        run: |
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkeypair \
              -keystore my-upload-key.jks \
              -storepass android \
              -keypass android \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Release,O=Android,C=US"
            echo "Generated my-upload-key.jks"
          else
            echo "Using existing my-upload-key.jks"
          fi

      - name: Assemble Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: gradle --no-daemon assembleRelease

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
